---
- name: Converge
  hosts: all
  environment:
    GITHUB_ACTIONS: "maybe"
    ANSIBLE_HASH_BEHAVIOUR: merge
  vars:
    nginx:
      set_real_ip_from:
        test:
          - 127.0.0.1/32
          - 127.0.0.2/32
          - 127.0.0.3/32
  tasks:
    - name: "Include ansible-proserver-nginx"
      ansible.builtin.include_role:
        name: "ansible-proserver-nginx"
