{#
  Default (catch-all) vhost.

  Every listen socket carries `default_server` explicitly. `include http.d/*.conf`
  is globbed alphabetically, so without this the first vhost file (app.conf)
  is silently promoted to catch-all for any socket that has no explicit default.

  Sockets covered:
    0.0.0.0:80  / [::]:80    public HTTP
    0.0.0.0:443 / [::]:443   public HTTPS
    [::1]:87                 gate64 HTTP  (PROXY protocol)
    [::1]:57                 gate64 HTTPS (PROXY protocol)
#}
{% set gate64 = ansible_local.proserver | default(none) and ansible_local.proserver.routing.with_gate64 %}

################################################################################
# HTTP catch-all
################################################################################
server {
    listen 0.0.0.0:80 default_server;
    listen [::]:80 default_server;
{% if gate64 %}
    listen [::1]:87 default_server proxy_protocol;
{% endif %}

    root /var/null;

    # http-01 must stay reachable for every Host, including domains that do
    # not have a vhost yet. Included before `location /` so the exact-prefix
    # match wins over the catch-all below.
    include {{ nginx.prefix.config }}/include/letsencrypt.conf;

    # A server-level `return` would run before location selection and kill the
    # ACME path above, so this has to live in a location.
    location / {
        return 444;
    }
}

################################################################################
# HTTPS catch-all
################################################################################
server {
    listen 0.0.0.0:443 default_server ssl{{ '' if nginx_separate_http2 else ' http2' }};
    listen [::]:443 default_server ssl{{ '' if nginx_separate_http2 else ' http2' }};
{% if gate64 %}
    listen [::1]:57 default_server ssl{{ '' if nginx_separate_http2 else ' http2' }} proxy_protocol;
{% endif %}
{% if nginx_separate_http2 %}
    http2 on;
{% endif %}

    # Dummy certificate from the dehydrated role, deliberately not the fqdn one:
    # an unknown SNI (and bare IP access, which sends no SNI at all) must not be
    # answered with a real hostname's certificate. nginx refuses to start on an
    # `ssl` listener with no certificate, so the handshake completes and the
    # request is dropped at the HTTP layer -- every attempt is logged.
    ssl_certificate     {{ nginx.default_server_certificate }};
    ssl_certificate_key {{ nginx.default_server_certificate_key }};
    # https_params.conf sets `ssl_stapling on` -- it cannot be turned back off
    # here, nginx rejects a duplicate ssl_stapling/ssl_stapling_verify in the
    # same context. Harmless: a self-signed cert carries no OCSP responder URL,
    # so nginx logs one `"ssl_stapling" ignored` warning at load and moves on.
    include {{ nginx.prefix.config }}/include/https_params.conf;

    # Also reached with a valid SNI: a client may send an SNI that matches a real
    # vhost (handshake completes on that vhost's cert) and then a Host header
    # matching no server_name. Request-level server selection falls back here,
    # with the handshake already done.
    root /var/null;
    return 444;
}

{% if dehydrated | cert_exists(ansible_facts['fqdn']) %}
################################################################################
# Machine name -- {{ ansible_facts['fqdn'] }}
################################################################################
server {
    listen 0.0.0.0:80;
    listen [::]:80;
{% if gate64 %}
    listen [::1]:87 proxy_protocol;
{% endif %}

    server_name {{ ansible_facts['fqdn'] }};

    root /var/null;

    location / {
        return 301 https://$host$request_uri;
    }

    include {{ nginx.prefix.config }}/include/letsencrypt.conf;
}

server {
    listen 0.0.0.0:443 ssl{{ '' if nginx_separate_http2 else ' http2' }};
    listen [::]:443 ssl{{ '' if nginx_separate_http2 else ' http2' }};
{% if gate64 %}
    listen [::1]:57 ssl{{ '' if nginx_separate_http2 else ' http2' }} proxy_protocol;
{% endif %}
{% if nginx_separate_http2 %}
    http2 on;
{% endif %}

    server_name {{ ansible_facts['fqdn'] }};

    root /var/null;

    include {{ nginx.prefix.config }}/include/security_headers.conf;

{% if nginx.security_txt.Contact %}
    include {{ nginx.prefix.config }}/include/security_txt.conf;
{% endif %}

    ssl_certificate {{ dehydrated | cert_fullchain(ansible_facts['fqdn']) }};
    ssl_certificate_key {{ dehydrated | cert_privkey(ansible_facts['fqdn']) }};
    ssl_trusted_certificate {{ dehydrated | cert_chain(ansible_facts['fqdn']) }};
    include {{ nginx.prefix.config }}/include/https_params.conf;

    # security.txt uses `location =`, which outranks this prefix match.
    location / {
        return 404;
    }
}
{% endif %}

{% if nginx.ansible_info.server_name %}
server {
    listen 0.0.0.0:80;
    listen [::]:80;
    {% if gate64 -%}
    listen [::1]:87 proxy_protocol;
    {%- endif %}

    server_name {{ nginx.ansible_info.server_name }};

    root /dev/null/404;

    include {{ nginx.prefix.config }}/include/letsencrypt.conf;

{% if dehydrated | cert_exists(nginx.ansible_info.server_name) %}
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    {% if nginx_separate_http2 %}
    listen 0.0.0.0:443 ssl;
    listen [::]:443 ssl;
    http2 on;
    {% else %}
    listen 0.0.0.0:443 ssl http2;
    listen [::]:443 ssl http2;
    {% endif %}
    {% if gate64 -%}
    listen [::1]:57 ssl {{ '' if nginx_separate_http2 else 'http2' }} proxy_protocol;
    {%- endif %}

    server_name {{ nginx.ansible_info.server_name }};

    root /dev/null/404;

    ssl_certificate {{ dehydrated | cert_fullchain(nginx.ansible_info.server_name) }};
    ssl_certificate_key {{ dehydrated | cert_privkey(nginx.ansible_info.server_name) }};
    ssl_trusted_certificate {{ dehydrated | cert_chain(nginx.ansible_info.server_name) }};
    include {{ nginx.prefix.config }}/include/https_params.conf;

{% endif %}
    location = / {
        add_header Content-Type application/json;
        return 200 '{"inventory_hostname": "{{ inventory_hostname }}"}';
    }

    {% if nginx.ansible_info.private_api %}
    location {{ nginx.ansible_info.private_api }} {
        add_header Content-Type application/json;
        return 200 '{"inventory_hostname": "{{ inventory_hostname }}", "groups": {{ group_names | to_json }}, "https_endpoints": {{ (dehydrated.domains.keys() | list + dehydrated.domains.values() | sum(start=[])) | to_json }}}';
    }
    {% endif %}

    include {{ nginx.prefix.config }}/include/security_headers.conf;
}
{% endif %}
